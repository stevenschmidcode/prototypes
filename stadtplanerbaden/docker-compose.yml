services:
  db:
    image: postgres:17-alpine
    container_name: baden-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: baden
      POSTGRES_PASSWORD: baden_local_dev
      POSTGRES_DB: baden
    ports:
      - "5433:5432"
    volumes:
      - baden-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U baden -d baden"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  baden-pgdata:
